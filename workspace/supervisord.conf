[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; One pod, one workspace, one Claude session. `new-session -A` attaches to the
; existing session if there is one, so every browser tab shares the same
; terminal -- which is now the correct behaviour.
;
; ttyd bakes its base path into the JS it serves, so it must be told the exact
; prefix the dashboard proxies it under (TTY_BASE_PATH=/tty/<workspace-id>).
[program:ttyd]
command=ttyd -p 7681 -b "%(ENV_TTY_BASE_PATH)s" -W byobu new-session -A -s claude
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",NVM_DIR="/home/ubuntu/.nvm",TERM="xterm-256color",GITHUB_TOKEN="%(ENV_GITHUB_TOKEN)s",GH_TOKEN="%(ENV_GITHUB_TOKEN)s",CODEX_HOME="%(ENV_CODEX_HOME)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/ttyd.log
stderr_logfile=/var/log/supervisor/ttyd.log

; codexapp is a browser client for `codex app-server`. Authentication is
; supplied interactively through the UI and persists in CODEX_HOME on the PVC.
; The dashboard ingress is the authentication boundary, so the app's own
; password and tunnel are deliberately disabled. This is an unattended remote
; workspace: Codex gets full in-pod access without interactive approval gates;
; the pod's user, mounts, RBAC and NetworkPolicy remain the security boundary.
[program:codex-ui]
command=codexapp "%(ENV_WORKSPACE_DIR)s" --port 7684 --base-path "/codex/%(ENV_WORKSPACE_ID)s" --no-tunnel --no-open --no-login --no-password --sandbox-mode danger-full-access --approval-policy never
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",CODEX_HOME="%(ENV_CODEX_HOME)s",GITHUB_TOKEN="%(ENV_GITHUB_TOKEN)s",GH_TOKEN="%(ENV_GITHUB_TOKEN)s"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; code-server (browser VS Code) on the checkout, proxied at /code/<id>/. The
; script exits 0 at once unless CODE_ENABLE is set (pod env, inherited through
; supervisord), and with startsecs=0 + exitcodes=0 that is a clean EXITED, not
; a FATAL: a workspace without the editor runs no process. Same environment as
; codex-ui so its integrated terminal matches ttyd's.
[program:code-server]
command=/home/ubuntu/bootstrap/code-server.sh
directory=%(ENV_WORKSPACE_DIR)s
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",TERM="xterm-256color",CODEX_HOME="%(ENV_CODEX_HOME)s",GITHUB_TOKEN="%(ENV_GITHUB_TOKEN)s",GH_TOKEN="%(ENV_GITHUB_TOKEN)s"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/code-server.log
stderr_logfile=/var/log/supervisor/code-server.log

[program:agent]
command=node /home/ubuntu/agent/agent.js
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",AGENT_PORT="7682",WORKSPACE_ID="%(ENV_WORKSPACE_ID)s",BRANCH="%(ENV_BRANCH)s",CLAUDE_SESSION_NAME="%(ENV_CLAUDE_SESSION_NAME)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent.log

[program:postgres]
command=/bin/bash -c 'exec $(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/postgres -D /home/ubuntu/pgdata -c listen_addresses=localhost -p 5432'
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.log

; Ralph's daemon: headless, so its lifecycle never depends on tmux. It is not
; autostarted here -- the agent starts it when the checkout has a
; ralph.config.json, or when the dashboard's Ralph button asks (see agent.js).
; Exit 0 is a deliberate `ralph daemon shutdown` and stays down; a crash is
; restarted, and three starts that die inside startsecs end FATAL rather than
; looping (e.g. no usable harness: ralph exits 5). TERM is Ralph's own clean
; shutdown. The byobu `ralph` window only tails this log.
[program:ralph]
command=ralph daemon
directory=%(ENV_WORKSPACE_DIR)s
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",GITHUB_TOKEN="%(ENV_GITHUB_TOKEN)s",GH_TOKEN="%(ENV_GITHUB_TOKEN)s"
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ralph.log
