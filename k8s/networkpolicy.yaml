---
# Ports 7681 (shell), 7682 (agent), 7684 (Codex UI) and 4280 (Ralph UI, only
# listening while someone runs ralph) are unauthenticated inside the cluster.
# With one pod per workspace the exposure multiplies, so only the dashboard may
# reach them. 4280 must match the dashboard's RALPH_UI_PORT.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: berth-workspace-ingress
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: berth-workspace
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: berth-dashboard
      ports:
        - protocol: TCP
          port: 7681
        - protocol: TCP
          port: 7682
        - protocol: TCP
          port: 7684
        - protocol: TCP
          port: 4280
