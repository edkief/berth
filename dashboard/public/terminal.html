<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1315">
  <title>Berth terminal</title>
  <link rel="stylesheet" href="/styles/terminal.css">
</head>
<body>
  <iframe id="terminal-frame" title="Workspace terminal"></iframe>
  <div class="terminal-controls">
    <aside class="keyboard-drawer" id="keyboard-drawer" aria-label="Terminal shortcut keys" aria-hidden="true" inert hidden>
      <header class="keyboard-drawer__header">
        <div><strong>Terminal keys</strong><span id="keyboard-status" aria-live="polite">Connecting…</span></div>
        <button class="keyboard-close" id="keyboard-close" type="button" aria-label="Hide terminal keys">Hide <span aria-hidden="true">×</span></button>
      </header>
      <div class="key-layout key-layout--main" id="key-layout-main" aria-label="Terminal navigation keys"></div>
      <div class="key-layout key-layout--function" id="key-layout-function" aria-label="Terminal function keys" hidden></div>
    </aside>
    <button class="keyboard-toggle" id="keyboard-toggle" type="button" aria-controls="keyboard-drawer" aria-expanded="false">
      <span aria-hidden="true">⌨</span> Keys
    </button>
  </div>
  <script type="module" src="/js/terminal-shortcuts.mjs"></script>
</body>
</html>
